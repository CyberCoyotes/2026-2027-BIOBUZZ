repositories {
    mavenCentral()
    google() // Needed for androidx
    // Panels (the live dashboard). These two repositories are copied from the Panels quickstart.
    maven { url = "https://mymaven.bylazar.com/releases" }
    maven { url = "https://repo.dairy.foundation/releases" }
}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    // Panels: a live dashboard you open in a browser on the laptop. Same version as the quickstart.
    implementation "com.bylazar:fullpanels:1.0.19"
    // Pedro Pathing 3: the library that drives our autonomous paths. Both lines and their
    // versions are copied from the official Pedro Pathing Quickstart (github.com/Pedro-Pathing/Quickstart).
    //   revhub = Pedro's core path follower plus the code that talks to REV hubs, motors and the Pinpoint.
    //   tuning = "AutoTune", the web page that tunes the robot (opens at http://192.168.43.1:10158).
    // Pedro also needs the repo.dairy.foundation repository above. To update Pedro, change the version
    // numbers here, then do a Gradle sync.
    implementation 'com.pedropathing:revhub:3.0.2'
    implementation 'com.pedropathing:tuning:1.0.3'
}

